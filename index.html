<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezepte</title>
<link rel="stylesheet" href="css/style.css">

<!-- PWA: installierbar auf Windows/Android, "Zum Home-Bildschirm" auf iOS -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5d8a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="login-gate" id="login-gate">
  <div class="login-card">
    <div class="brand" style="cursor:default">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5C4 7 7.6 3.5 12 3.5s8 3.5 8 8c0 5-4 8-8 9-4-1-8-4-8-9Z"/><path d="M12 8v5"/><path d="M9.5 9.8h5"/></svg>
      <div>
        <p class="brand-name">Rezepte</p>
        <p class="brand-sub">Rezeptarchiv · aus der OneNote-Ablage</p>
      </div>
    </div>
    <p class="login-hint">Bitte anmelden, um die Rezepte zu sehen.</p>
    <div class="field">
      <label for="login-email">E-Mail</label>
      <input id="login-email" type="email" autocomplete="username">
    </div>
    <div class="field" style="margin-top:10px">
      <label for="login-password">Passwort</label>
      <input id="login-password" type="password" autocomplete="current-password">
    </div>
    <div class="error-msg" id="login-error"></div>
    <button class="btn btn-primary" id="login-submit" style="width:100%; margin-top:16px">Anmelden</button>
  </div>
</div>

<div class="app" id="app-shell" hidden>

  <div class="topbar">
    <div class="brand" id="home-btn" role="button" tabindex="0" aria-label="Zur Startseite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5C4 7 7.6 3.5 12 3.5s8 3.5 8 8c0 5-4 8-8 9-4-1-8-4-8-9Z"/><path d="M12 8v5"/><path d="M9.5 9.8h5"/></svg>
      <div>
        <p class="brand-name">Rezepte</p>
        <p class="brand-sub">Rezeptarchiv · aus der OneNote-Ablage</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="recipe-count" id="total-count"></span>
      <button class="auth-btn" id="auth-btn">Abmelden</button>
    </div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Titel oder Zutat suchen, z. B. „Baumnüsse“ oder „Honig“ …" autocomplete="off">
  </div>

  <div id="view-home">
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <div id="view-list" hidden>
    <div class="section-head">
      <button class="back-btn" id="list-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Zurück</button>
      <h2 id="list-title">Kategorie</h2>
      <span class="section-count" id="list-count"></span>
      <button class="icon-btn add-btn" id="add-btn" title="Neues Rezept" aria-label="Neues Rezept">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="recipe-list" id="recipe-list"></div>
  </div>

  <div id="view-detail" hidden>
    <div class="section-head">
      <button class="back-btn" id="detail-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Zurück</button>
      <div class="detail-actions" id="detail-actions">
        <button class="icon-btn" id="edit-btn" title="Bearbeiten" aria-label="Rezept bearbeiten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn icon-btn-danger" id="delete-btn" title="Löschen" aria-label="Rezept löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
        </button>
      </div>
    </div>
    <div class="detail" id="detail-body"></div>
  </div>

</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal-box"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
